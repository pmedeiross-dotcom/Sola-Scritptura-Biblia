name: Redesign Home

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign:
    if: github.event.head_commit.message != 'Apply home access grid redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace active HomeScreen
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          start = text.find('const HomeScreen = (')
          end = text.find('const BibleScreen = (', start)
          if start < 0 or end < 0:
              raise SystemExit('Active HomeScreen markers not found')

          new_home = r'''const HomeScreen = ({
  onNavigate,
  onOpenPlan,
}: {
  onNavigate: (s: Screen) => void;
  onOpenPlan: (plan: ReadingPlan) => void;
}) => {
  const dailyRef = DAILY_VERSE_REFERENCES[getDailyReferenceIndex(new Date())];
  const quickActions = [
    { label: 'Ler Bíblia', desc: 'Abra as Escrituras', icon: Book, action: () => onNavigate('bible'), tone: 'amber' },
    { label: 'Pesquisar', desc: 'Encontre uma passagem', icon: Search, action: () => onNavigate('bible'), tone: 'violet' },
    { label: 'Favoritos', desc: 'Versículos guardados', icon: Bookmark, action: () => onNavigate('library'), tone: 'rose' },
    { label: 'Marcações', desc: 'Destaques da leitura', icon: Highlighter, action: () => onNavigate('library'), tone: 'orange' },
    { label: 'Anotações', desc: 'Suas notas de estudo', icon: MessageSquare, action: () => onNavigate('library'), tone: 'blue' },
    { label: 'Histórico', desc: 'Continue de onde parou', icon: History, action: () => onNavigate('library'), tone: 'slate' },
    { label: 'Traduções', desc: 'Compare versões', icon: Layers, action: () => onNavigate('bible'), tone: 'cyan' },
    { label: 'Plano de leitura', desc: 'Mantenha seu ritmo', icon: Calendar, action: () => onNavigate('reading-plans'), tone: 'emerald' },
    { label: 'Temas', desc: 'Estude por assunto', icon: MapPin, action: () => onNavigate('study'), tone: 'fuchsia' },
    { label: 'Estudo com IA', desc: 'Explore o texto', icon: Sparkles, action: () => onNavigate('study'), tone: 'indigo' },
    { label: 'Confissões', desc: 'Doutrina reformada', icon: Library, action: () => onNavigate('confessions'), tone: 'teal' },
    { label: 'Biblioteca', desc: 'Recursos de estudo', icon: Book, action: () => onNavigate('library'), tone: 'purple' },
  ];

  return (
    <div className="home-launcher animate-fade-in h-full min-h-0 overflow-y-auto bg-[#f4f6fb] dark:bg-[#0b1115]">
      <div className="mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8 py-5 sm:py-7 pb-28">
        <header className="home-launcher-header mb-6">
          <div>
            <p className="home-kicker">SOLA SCRIPTURA</p>
            <h1 className="home-title">Seu espaço de leitura e estudo</h1>
            <p className="home-subtitle">Acesse rapidamente tudo o que você usa para examinar as Escrituras.</p>
          </div>
          <button type="button" onClick={() => onNavigate('settings')} className="home-settings-button" aria-label="Configurações">
            <SettingsIcon className="w-5 h-5" />
          </button>
        </header>

        <section className="home-verse-hero">
          <div className="home-verse-content">
            <span className="home-verse-label">Versículo do dia</span>
            <p className="home-verse-text">&quot;Lâmpada para os meus pés é tua palavra, e luz para o meu caminho.&quot;</p>
            <div className="home-verse-ref">{dailyRef.book} {dailyRef.chapter}:{dailyRef.verse}</div>
          </div>
          <button type="button" onClick={() => onNavigate('bible')} className="home-verse-button">Ler agora <ChevronRight className="w-5 h-5" /></button>
        </section>

        <section className="home-featured-grid">
          <button type="button" onClick={() => onNavigate('bible')} className="home-featured-card home-featured-bible">
            <span className="home-featured-icon"><Book className="w-6 h-6" /></span>
            <span><strong>Ler a Bíblia</strong><small>Continue sua leitura</small></span>
            <ChevronRight className="w-5 h-5 ml-auto" />
          </button>
          <button type="button" onClick={() => onNavigate('study')} className="home-featured-card home-featured-study">
            <span className="home-featured-icon"><Sparkles className="w-6 h-6" /></span>
            <span><strong>Estudar</strong><small>Contexto, doutrina e IA</small></span>
            <ChevronRight className="w-5 h-5 ml-auto" />
          </button>
        </section>

        <section className="home-access-section">
          <div className="home-section-heading"><div><p className="home-kicker">Acesso rápido</p><h2>Ferramentas</h2></div><span>12 atalhos</span></div>
          <div className="home-access-grid">
            {quickActions.map(({ label, desc, icon: Icon, action, tone }) => (
              <button key={label} type="button" onClick={action} className={`home-access-tile home-tone-${tone}`}>
                <span className="home-access-icon"><Icon className="w-6 h-6" strokeWidth={1.8} /></span>
                <strong>{label}</strong>
                <small>{desc}</small>
              </button>
            ))}
          </div>
        </section>

        <section className="home-section home-plans-section">
          <div className="home-section-heading"><div><p className="home-kicker">Continue</p><h2>Planos de leitura</h2></div><button type="button" onClick={() => onNavigate('reading-plans')}>Ver todos</button></div>
          <div className="home-plans-row">
            {READING_PLANS.map((plan) => (
              <button key={plan.id} type="button" onClick={() => onOpenPlan(plan)} className="home-plan-card">
                <div className="home-plan-top"><span><Calendar className="w-4 h-4" /></span><small>Dia {plan.currentDay}/{plan.days}</small></div>
                <strong>{plan.title}</strong>
                <div className="home-progress"><i style={{ width: `${plan.progress}%` }} /></div>
                <div className="home-plan-bottom"><small>{plan.progress}% concluído</small><b>Continuar</b></div>
              </button>
            ))}
          </div>
        </section>

        <section className="home-mini-row">
          <button type="button" onClick={() => onNavigate('confessions')}><Library className="w-5 h-5" /><span><strong>Confissões</strong><small>Westminster, Heidelberg e Belga</small></span><ChevronRight className="w-5 h-5 ml-auto" /></button>
          <button type="button" onClick={() => onNavigate('library')}><Book className="w-5 h-5" /><span><strong>Biblioteca</strong><small>Notas, favoritos e recursos</small></span><ChevronRight className="w-5 h-5 ml-auto" /></button>
        </section>
      </div>
    </div>
  );
};

'''
          text = text[:start] + new_home + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Add launcher styles
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/index.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* Sola Scriptura home launcher */'
          if marker not in text:
              text += r'''

/* Sola Scriptura home launcher */
.home-launcher { color: #14202a; }
.dark .home-launcher { color: #edf3f5; }
.home-launcher-header { display:flex; align-items:flex-start; gap:16px; justify-content:space-between; }
.home-kicker { margin:0; font-size:10px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; color:#5b5ce2; }
.home-title { margin:.4rem 0 0; font:800 clamp(25px,3.5vw,36px)/1.05 Georgia,serif; letter-spacing:-.035em; }
.home-subtitle { margin-top:7px; color:#7b8794; font-size:13px; line-height:1.55; }
.dark .home-subtitle { color:#94a3ad; }
.home-settings-button { width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.86);color:#667085;border:1px solid rgba(148,163,184,.18);box-shadow:0 8px 25px rgba(15,23,42,.06); }
.dark .home-settings-button { background:#141d22;color:#a9b6bd;border-color:rgba(255,255,255,.08); }
.home-verse-hero { display:flex;align-items:flex-end;justify-content:space-between;gap:22px;min-height:235px;padding:28px 30px;border-radius:30px;color:#fff;background:linear-gradient(135deg,#5a5be3,#4444b5);box-shadow:0 24px 55px rgba(72,72,185,.22);position:relative;overflow:hidden; }
.home-verse-hero:after { content:'S'; position:absolute;right:-20px;bottom:-110px;font:900 330px Georgia,serif;color:rgba(255,255,255,.05);pointer-events:none; }
.home-verse-content { position:relative;z-index:1;max-width:850px; }
.home-verse-label { font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.72); }
.home-verse-text { margin-top:25px;font:italic 500 clamp(25px,3.6vw,39px)/1.2 Georgia,serif;letter-spacing:-.025em; }
.home-verse-ref { margin-top:20px;font-size:16px;font-weight:800; }
.home-verse-button { position:relative;z-index:2;display:flex;align-items:center;gap:5px;padding:11px 15px;border-radius:14px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.18);font-size:12px;font-weight:900;white-space:nowrap; }
.home-featured-grid { display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px; }
.home-featured-card { min-height:104px;padding:18px;display:flex;align-items:center;gap:13px;border-radius:22px;border:1px solid rgba(148,163,184,.16);box-shadow:0 10px 30px rgba(15,23,42,.06);text-align:left;transition:transform .18s ease,box-shadow .18s ease; }
.home-featured-card:hover,.home-access-tile:hover,.home-plan-card:hover,.home-mini-row button:hover { transform:translateY(-2px);box-shadow:0 16px 35px rgba(15,23,42,.10); }
.home-featured-bible { background:linear-gradient(135deg,#fff7df,#fff);color:#18202a; }.home-featured-study { background:linear-gradient(135deg,#eafff5,#fff);color:#18202a; }
.dark .home-featured-bible,.dark .home-featured-study { background:#141d22;color:#edf3f5; }
.home-featured-icon { width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#fff0b9;color:#c77b00;flex:none; }.home-featured-study .home-featured-icon{background:#c9f7df;color:#008f68;}
.home-featured-card strong,.home-featured-card small { display:block; }.home-featured-card strong{font-size:16px}.home-featured-card small{margin-top:4px;color:#7d8792;font-size:11px}.dark .home-featured-card small{color:#9ba8b0}
.home-access-section,.home-section { margin-top:30px; }.home-section-heading { display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:13px; }.home-section-heading h2{margin-top:5px;font:800 23px/1.1 Georgia,serif;letter-spacing:-.025em}.home-section-heading > span,.home-section-heading button{font-size:11px;font-weight:900;color:#5b5ce2;text-transform:uppercase;letter-spacing:.08em}
.home-access-grid { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px; }
.home-access-tile { min-height:132px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:21px;background:rgba(255,255,255,.92);border:1px solid rgba(148,163,184,.16);box-shadow:0 8px 25px rgba(15,23,42,.045);transition:.18s ease; }.dark .home-access-tile{background:#141d22;border-color:rgba(255,255,255,.07)}
.home-access-icon{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;margin-bottom:9px;background:#eef0ff;color:#5b5ce2}.home-access-tile strong{font-size:13px}.home-access-tile small{margin-top:4px;color:#89939d;font-size:10px}.dark .home-access-tile small{color:#8f9ca4}
.home-tone-amber .home-access-icon{background:#fff1bf;color:#d27c00}.home-tone-violet .home-access-icon{background:#eeeaff;color:#7357d8}.home-tone-rose .home-access-icon{background:#ffe8ee;color:#d24c71}.home-tone-orange .home-access-icon{background:#fff0df;color:#dc7b20}.home-tone-blue .home-access-icon{background:#e6f1ff;color:#3976cf}.home-tone-slate .home-access-icon{background:#edf0f3;color:#637083}.home-tone-cyan .home-access-icon{background:#e3f8fb;color:#168aa0}.home-tone-emerald .home-access-icon{background:#ddf8e9;color:#16875b}.home-tone-fuchsia .home-access-icon{background:#fae9ff;color:#a43cc0}.home-tone-indigo .home-access-icon{background:#e8eaff;color:#4f58d7}.home-tone-teal .home-access-icon{background:#def7f3;color:#118f7b}.home-tone-purple .home-access-icon{background:#f0e8ff;color:#7650c6}
.home-plans-row { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;overflow-x:auto;padding-bottom:4px; }.home-plan-card{min-width:0;text-align:left;padding:18px;border-radius:21px;background:rgba(255,255,255,.92);border:1px solid rgba(148,163,184,.16);box-shadow:0 8px 25px rgba(15,23,42,.045);transition:.18s ease}.dark .home-plan-card{background:#141d22;border-color:rgba(255,255,255,.07)}
.home-plan-top{display:flex;align-items:center;justify-content:space-between}.home-plan-top span{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:#eef0ff;color:#5b5ce2}.home-plan-top small{font-size:10px;font-weight:800;color:#98a1aa}.home-plan-card strong{display:block;margin-top:16px;font-size:15px}.home-progress{height:7px;margin-top:14px;border-radius:99px;background:#edf0f4;overflow:hidden}.home-progress i{display:block;height:100%;border-radius:99px;background:#5b5ce2}.home-plan-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.home-plan-bottom small{font-size:10px;color:#98a1aa;text-transform:uppercase;letter-spacing:.05em}.home-plan-bottom b{font-size:11px;color:#5b5ce2}
.home-mini-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.home-mini-row button{display:flex;align-items:center;gap:12px;padding:17px;border-radius:20px;background:rgba(255,255,255,.92);border:1px solid rgba(148,163,184,.16);color:#5b5ce2;box-shadow:0 8px 25px rgba(15,23,42,.045);text-align:left;transition:.18s ease}.dark .home-mini-row button{background:#141d22;border-color:rgba(255,255,255,.07)}.home-mini-row span strong,.home-mini-row span small{display:block}.home-mini-row span strong{font-size:13px;color:#18202a}.dark .home-mini-row span strong{color:#edf3f5}.home-mini-row span small{margin-top:3px;color:#8a949e;font-size:10px}
@media(max-width:900px){.home-access-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.home-plans-row{grid-template-columns:repeat(3,260px)}}
@media(max-width:640px){.home-launcher-header{align-items:center}.home-title{font-size:25px}.home-verse-hero{min-height:260px;padding:23px;display:block}.home-verse-text{margin-top:18px;font-size:27px}.home-verse-button{margin-top:20px;width:max-content}.home-featured-grid{grid-template-columns:1fr}.home-access-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.home-access-tile{min-height:126px}.home-plans-row{grid-template-columns:repeat(3,260px)}.home-mini-row{grid-template-columns:1fr}}
'''
              path.write_text(text, encoding='utf-8')

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit home redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add src/App.tsx src/index.css
          git commit -m "Apply home access grid redesign"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/redesign-home.yml
          git commit -m "Remove home redesign automation"
          git push
