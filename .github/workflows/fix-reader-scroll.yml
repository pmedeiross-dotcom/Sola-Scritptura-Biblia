name: Fix Bible reader scroll

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Bible reader single scroll'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused scroll fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          old = ''' const updateCurrentVisibleVerse = () => {\n  const container = verseContainerRef.current;'''
          new = ''' const updateCurrentVisibleVerse = () => {\n  const container = screenScrollRef.current;'''
          if old not in text:
              raise SystemExit('Could not find visible-verse container block')
          text = text.replace(old, new, 1)

          old = '''  const container = verseContainerRef.current;\n  if (!container) return;\n\n  const handleVerseScroll = () => {'''
          new = '''  const container = screenScrollRef.current;\n  if (!container) return;\n\n  const handleVerseScroll = () => {'''
          if old not in text:
              raise SystemExit('Could not find verse scroll listener block')
          text = text.replace(old, new, 1)

          old = '''className={cn("space-y-2.5 overflow-y-auto pr-1.5", isFocusMode ? "max-h-[78vh]" : "max-h-[64vh]")}'''
          new = '''className="space-y-2.5 pr-1.5"'''
          if old not in text:
              raise SystemExit('Could not find nested verse scroll container')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-reader-scroll.yml
          git add src/App.tsx .github/workflows/fix-reader-scroll.yml
          git commit -m "Fix Bible reader single scroll"
          git push
