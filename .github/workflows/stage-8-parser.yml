name: Stage 8 parser patch

on:
  push:
    branches: [stage-8-parser]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parser and documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          old = """    const parsed: Array<{ number: number; text: string }> = [];\n    let current: { number: number; text: string } | null = null;\n\n    for (const line of lines) {\n      const match = line.match(/^(\\d+)[\\.:]?\\s+(.+)$/);\n      if (match) {\n        if (current) parsed.push(current);\n        current = { number: parseInt(match[1], 10), text: match[2].trim() };\n      } else if (current) {\n        current.text += ` ${line}`;\n      }\n    }\n"""
          new = """    const parsed: Array<{ number: number; text: string }> = [];\n    let current: { number: number; text: string } | null = null;\n\n    for (const line of lines) {\n      const match = line.match(/^(\\d{1,3})(?:[\\.:]\\s+|\\s+)(.+)$/);\n      const candidateNumber = match ? Number(match[1]) : null;\n      const isVerseStart = Boolean(\n        match &&\n        Number.isInteger(candidateNumber) &&\n        candidateNumber > 0 &&\n        (!current || candidateNumber === current.number + 1)\n      );\n\n      if (match && isVerseStart) {\n        if (current) parsed.push(current);\n        current = { number: candidateNumber as number, text: match[2].trim() };\n      } else if (current) {\n        current.text += ` ${line}`;\n      }\n    }\n"""
          if old not in text:
              raise SystemExit('App verse parser block not found')
          text = text.replace(old, new, 1)
          text = text.replace("/\\{[HG]\\d+\\}/gi", "/\\{[HG]\\d+[a-z]?\\}/gi")
          text = text.replace("/(\\{[HG]\\d+\\})/gi", "/(\\{[HG]\\d+[a-z]?\\})/gi")
          text = text.replace("/^\\{([HG]\\d+)\\}$/i", "/^\\{([HG]\\d+[a-z]?)\\}$/i")
          app.write_text(text)

          service = Path('src/services/bibleService.ts')
          text = service.read_text()
          old = """    .map(line => {\n      const match = line.match(/^(\\d+)[\\.:]?\\s+(.+)$/);\n      return match ? { verse: parseInt(match[1], 10), text: match[2].trim() } : null;\n    })\n    .filter((item): item is { verse: number; text: string } => item !== null);\n"""
          new = """    .reduce<Array<{ verse: number; text: string }>>((parsed, line) => {\n      const match = line.match(/^(\\d{1,3})(?:[\\.:]\\s+|\\s+)(.+)$/);\n      const candidate = match ? Number(match[1]) : null;\n      const current = parsed[parsed.length - 1];\n      const isVerseStart = Boolean(\n        match &&\n        Number.isInteger(candidate) &&\n        candidate > 0 &&\n        (!current || candidate === current.verse + 1)\n      );\n\n      if (match && isVerseStart) {\n        parsed.push({ verse: candidate as number, text: match[2].trim() });\n      } else if (current) {\n        current.text += ` ${line}`;\n      }\n      return parsed;\n    }, []);\n"""
          if old not in text:
              raise SystemExit('bibleService verse parser block not found')
          service.write_text(text.replace(old, new, 1))

          Path('docs/ETAPA_8.md').write_text('''# ETAPA 8 — Parser bíblico e Strong\n\n## Resultado\n\n**CONCLUÍDA.**\n\n### Ajustes realizados\n\n- Números Strong agora aceitam o formato básico e sufixos alfabéticos, como `{H1234}`, `{H1234a}` e `{G3056}`.\n- A ocultação dos Strong e a renderização visual usam a mesma regra de reconhecimento.\n- O parser de versículos do Reader passou a aceitar apenas um novo número quando ele é sequencial ao versículo anterior; linhas numéricas de continuação deixam de iniciar um novo versículo.\n- O parser equivalente de `bibleService` foi alinhado ao mesmo comportamento.\n- O texto original é preservado; a alteração atua somente na identificação estrutural dos versículos e dos marcadores Strong.\n\n### Validação\n\nCasos cobertos conceitualmente: `1`, `1.`, `1:`; continuação textual iniciada por número; `{H1234}`, `{H1234a}`, `{G3056}` e ocultação dos marcadores.\n''')

          status = Path('PROJECT_STATUS.md')
          s = status.read_text()
          s = s.replace('### Stage 8 — Parser bíblico e Strong\n- **PENDENTE**', '### Stage 8 — Parser bíblico e Strong\n- **CONCLUÍDA** — parser de versículos e reconhecimento de Strong revisados e alinhados')
          status.write_text(s)
          PY
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/stage-8-parser.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/services/bibleService.ts docs/ETAPA_8.md PROJECT_STATUS.md .github/workflows/stage-8-parser.yml
          git commit -m "feat: complete stage 8 bible parser and strong handling"
          git push
