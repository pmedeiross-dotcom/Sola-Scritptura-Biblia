name: etapa3
on:
  push:
    branches: ["etapa-3-save-study"]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Implement save study
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace("  onApplyGoalProfile,\n  availableVersions,", "  onApplyGoalProfile,\n  onAddNote,\n  availableVersions,")
          s=s.replace("  onApplyGoalProfile: (profile: GoalProfile) => void;\n  availableVersions: string[];", "  onApplyGoalProfile: (profile: GoalProfile) => void;\n  onAddNote: (ref: string, content: string) => void;\n  availableVersions: string[];")
          marker="  const [scrollButtonsActive, setScrollButtonsActive] = useState(true);"
          s=s.replace(marker, marker+"\n  const [studySaved, setStudySaved] = useState(false);")
          marker2="  const scrollStudyBottom = () => {"
          insert="  const handleSaveStudy = () => {\n    if (!response) return;\n    const reference = scope === 'bible' ? 'Estudo bíblico' : `Estudo: ${referenceInput.trim() || 'referência'}`;\n    onAddNote(reference, `Consulta: ${query.trim()}\\n\\n${response}`);\n    setStudySaved(true);\n  };\n\n"
          s=s.replace(marker2, insert+marker2)
          s=s.replace("  const handleStudy = async () => {", "  const handleStudy = async () => {\n    setStudySaved(false);")
          marker3="    <div ref={scrollRef} />"
          addition="    <div className=\"mt-5 flex flex-col sm:flex-row sm:items-center gap-3\">\n      <button type=\"button\" onClick={handleSaveStudy} disabled={studySaved} className=\"flex-1 py-3 rounded-2xl bg-petrol-500 text-white font-bold disabled:opacity-70\">\n        {studySaved ? 'Estudo salvo em Anotações' : 'Salvar estudo em Anotações'}\n      </button>\n      {studySaved && <span className=\"text-xs font-semibold text-emerald-600 dark:text-emerald-400\">Consulta registrada.</span>}\n    </div>\n"
          if marker3 not in s: raise SystemExit('response marker missing')
          s=s.replace(marker3, marker3+addition, 1)
          s=s.replace("case 'study': return <StudyScreen goalTargets={goalTargets} onApplyGoalProfile={applyGoalProfile} availableVersions={bibleVersionCodes} />;", "case 'study': return <StudyScreen goalTargets={goalTargets} onApplyGoalProfile={applyGoalProfile} onAddNote={addNote} availableVersions={bibleVersionCodes} />;")
          p.write_text(s, encoding='utf-8')
      - name: Validate
        run: npm run lint && npm run build
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git rm .github/workflows/etapa3.yml
          git commit -m "feat: save study results to notes"
          git push
