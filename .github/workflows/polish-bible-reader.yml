name: Polish Bible Reader

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.event.head_commit.message != 'Polish Bible reader UX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Improve Bible reader UX
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          old = '''  const goToVerse = (verseNumber: number) => {
    if (verseNumber < 1) return;
    const verseElement = verseContainerRef.current?.querySelector<HTMLElement>(`[data-verse-number="${verseNumber}"]`);
    if (!verseElement) return;

    setHighlightedVerse(verseNumber);
    verseElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => setHighlightedVerse(current => (current === verseNumber ? null : current)), 1400);
  };'''

          new = '''  const goToVerse = (verseNumber: number) => {
    if (verseNumber < 1) return;
    const container = verseContainerRef.current;
    const verseElement = container?.querySelector<HTMLElement>(`[data-verse-number="${verseNumber}"]`);
    if (!container || !verseElement) return;

    setTargetVerse(String(verseNumber));
    setCurrentVisibleVerse(verseNumber);
    setHighlightedVerse(verseNumber);

    const targetTop = Math.max(
      0,
      verseElement.offsetTop - (container.clientHeight / 2) + (verseElement.offsetHeight / 2)
    );
    container.scrollTo({ top: targetTop, behavior: 'smooth' });
    setTimeout(() => setHighlightedVerse(current => (current === verseNumber ? null : current)), 1400);
  };'''
          if old not in text:
              raise SystemExit('goToVerse block not found')
          text = text.replace(old, new, 1)

          old = '''  const scrollToTop = () => {
    screenScrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const scrollToBottom = () => {
    const container = screenScrollRef.current;
    if (!container) return;
    container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
  };'''

          new = '''  const scrollToTop = () => {
    const container = verseContainerRef.current;
    if (!container) return;
    container.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const scrollToBottom = () => {
    const container = verseContainerRef.current;
    if (!container) return;
    container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
  };'''
          if old not in text:
              raise SystemExit('scroll controls block not found')
          text = text.replace(old, new, 1)

          old = '''              <div className="rounded-[1.75rem] bg-[#efe4c8] dark:bg-[#2a241d] border border-[#d7c7a2] dark:border-[#3a3228] shadow-inner px-4 sm:px-5 py-4 sm:py-5">
                {verses.length > 0 ? (
                  <div ref={verseContainerRef} className={cn("space-y-2.5 overflow-y-auto pr-1.5", isFocusMode ? "max-h-[78vh]" : "max-h-[64vh]")}>'''

          new = '''              <div className="rounded-[1.75rem] bg-[#efe4c8] dark:bg-[#2a241d] border border-[#d7c7a2] dark:border-[#3a3228] shadow-inner overflow-hidden">
                {verses.length > 0 ? (
                  <>
                    <div className="sticky top-0 z-10 flex flex-wrap items-center justify-between gap-2 px-4 sm:px-5 py-3 bg-[#efe4c8]/95 dark:bg-[#2a241d]/95 backdrop-blur border-b border-[#d7c7a2] dark:border-[#3a3228]">
                      <div className="flex items-center gap-2 min-w-0">
                        <span className="text-[11px] font-black uppercase tracking-wider text-petrol-700 dark:text-petrol-300">Leitura</span>
                        <span className="text-xs font-semibold text-gray-600 dark:text-gray-300 truncate">
                          {currentVisibleVerse ? `Versículo ${currentVisibleVerse}` : 'Posicione-se no texto'}
                        </span>
                      </div>
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <button onClick={scrollToTop} className="p-2 rounded-xl bg-white/70 dark:bg-black/20 text-gray-700 dark:text-gray-200 hover:bg-white dark:hover:bg-black/30" aria-label="Ir ao início da passagem" title="Início">
                          <ChevronUp className="w-4 h-4" />
                        </button>
                        <button onClick={scrollToBottom} className="p-2 rounded-xl bg-white/70 dark:bg-black/20 text-gray-700 dark:text-gray-200 hover:bg-white dark:hover:bg-black/30" aria-label="Ir ao fim da passagem" title="Fim">
                          <ChevronDown className="w-4 h-4" />
                        </button>
                        <button onClick={saveCurrentLocation} className="px-3 py-2 rounded-xl bg-petrol-500 text-white text-xs font-bold hover:bg-petrol-600" title="Salvar local atual">
                          <Bookmark className="w-4 h-4 inline-block mr-1" /> Salvar
                        </button>
                        <button onClick={openCommentaryModal} className="px-3 py-2 rounded-xl bg-white/80 dark:bg-black/20 text-petrol-700 dark:text-petrol-300 text-xs font-bold hover:bg-white dark:hover:bg-black/30" title="Abrir comentário">
                          <MessageSquare className="w-4 h-4 inline-block mr-1" /> Comentário
                        </button>
                      </div>
                    </div>
                    <div ref={verseContainerRef} className={cn("space-y-2.5 overflow-y-scroll overscroll-contain pr-2 scroll-smooth", isFocusMode ? "max-h-[78vh]" : "max-h-[64vh]")}>
'''
          if old not in text:
              raise SystemExit('Bible reader container block not found')
          text = text.replace(old, new, 1)

          # The old closing fragment for the verse branch needs to close the fragment before the fallback branch.
          old = '''                    ))}
                  </div>
                ) : (
'''
          new = '''                    ))}
                    </div>
                  </>
                ) : (
'''
          if old not in text:
              raise SystemExit('Bible reader closing block not found')
          text = text.replace(old, new, 1)

          # Keep the outer scroll controls visible, but make their labels explicitly about the Bible passage.
          text = text.replace('aria-label="Voltar ao topo"\n              title="Voltar ao topo"', 'aria-label="Voltar ao início da passagem"\n              title="Voltar ao início da passagem"', 1)
          text = text.replace('aria-label="Ir ao fim"\n              title="Ir ao fim"', 'aria-label="Ir ao fim da passagem"\n              title="Ir ao fim da passagem"', 1)

          if text == original:
              raise SystemExit('No changes made')

          path.write_text(text, encoding='utf-8')

      - name: Verify TypeScript build
        run: |
          npm ci
          npm run build

      - name: Commit polished reader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Polish Bible reader UX"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/polish-bible-reader.yml
          git commit -m "Remove one-time Bible reader automation"
          git push
