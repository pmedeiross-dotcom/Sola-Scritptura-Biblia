name: Polish Bible Reader

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.event.head_commit.message != 'Polish Bible reader UX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Improve Bible reader UX
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          old = '''  const goToVerse = (verseNumber: number) => {
    if (verseNumber < 1) return;
    const verseElement = verseContainerRef.current?.querySelector<HTMLElement>(`[data-verse-number="${verseNumber}"]`);
    if (!verseElement) return;

    setHighlightedVerse(verseNumber);
    verseElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => setHighlightedVerse(current => (current === verseNumber ? null : current)), 1400);
  };'''
          new = '''  const goToVerse = (verseNumber: number) => {
    if (verseNumber < 1) return;
    const container = verseContainerRef.current;
    const verseElement = container?.querySelector<HTMLElement>(`[data-verse-number="${verseNumber}"]`);
    if (!container || !verseElement) return;

    setTargetVerse(String(verseNumber));
    setCurrentVisibleVerse(verseNumber);
    setHighlightedVerse(verseNumber);

    const targetTop = Math.max(0, verseElement.offsetTop - (container.clientHeight / 2) + (verseElement.offsetHeight / 2));
    container.scrollTo({ top: targetTop, behavior: 'smooth' });
    setTimeout(() => setHighlightedVerse(current => (current === verseNumber ? null : current)), 1400);
  };'''
          if old not in text:
              raise SystemExit('goToVerse block not found')
          text = text.replace(old, new, 1)

          old = '''  const scrollToTop = () => {
    screenScrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const scrollToBottom = () => {
    const container = screenScrollRef.current;
    if (!container) return;
    container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
  };'''
          new = '''  const scrollToTop = () => {
    const container = verseContainerRef.current;
    if (!container) return;
    container.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const scrollToBottom = () => {
    const container = verseContainerRef.current;
    if (!container) return;
    container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
  };'''
          if old not in text:
              raise SystemExit('scroll controls block not found')
          text = text.replace(old, new, 1)

          old = '''              <div className="rounded-[1.75rem] bg-[#efe4c8] dark:bg-[#2a241d] border border-[#d7c7a2] dark:border-[#3a3228] shadow-inner px-4 sm:px-5 py-4 sm:py-5">
                {verses.length > 0 ? (
                  <div ref={verseContainerRef} className={cn("space-y-2.5 overflow-y-auto pr-1.5", isFocusMode ? "max-h-[78vh]" : "max-h-[64vh]")}>'''
          new = '''              <div className="app-reader-surface rounded-[1.75rem] bg-[#efe4c8] dark:bg-[#2a241d] border border-[#d7c7a2] dark:border-[#3a3228] shadow-inner overflow-hidden">
                {verses.length > 0 ? (
                  <>
                    <div className="sticky top-0 z-10 flex flex-wrap items-center justify-between gap-2 px-4 sm:px-5 py-3 bg-[#efe4c8]/95 dark:bg-[#2a241d]/95 backdrop-blur-xl border-b border-[#d7c7a2] dark:border-[#3a3228]">
                      <div className="flex items-center gap-2 min-w-0">
                        <span className="text-[11px] font-black uppercase tracking-wider text-petrol-700 dark:text-petrol-300">Leitura</span>
                        <span className="text-xs font-semibold text-gray-600 dark:text-gray-300 truncate">{currentVisibleVerse ? `Versículo ${currentVisibleVerse}` : 'Posicione-se no texto'}</span>
                      </div>
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <button onClick={scrollToTop} className="reader-tool-button" aria-label="Ir ao início da passagem" title="Início"><ChevronUp className="w-4 h-4" /></button>
                        <button onClick={scrollToBottom} className="reader-tool-button" aria-label="Ir ao fim da passagem" title="Fim"><ChevronDown className="w-4 h-4" /></button>
                        <button onClick={saveCurrentLocation} className="reader-primary-action" title="Salvar local atual"><Bookmark className="w-4 h-4" /> <span>Salvar</span></button>
                        <button onClick={openCommentaryModal} className="reader-secondary-action" title="Abrir comentário"><MessageSquare className="w-4 h-4" /> <span>Comentário</span></button>
                      </div>
                    </div>
                    <div ref={verseContainerRef} className={cn("reader-text-scroll space-y-2.5 overflow-y-scroll overscroll-contain pr-2 scroll-smooth", isFocusMode ? "max-h-[78vh]" : "max-h-[64vh]")}>
'''
          if old not in text:
              raise SystemExit('Bible reader container block not found')
          text = text.replace(old, new, 1)

          old = '''                    ))}
                  </div>
                ) : ('''
          new = '''                    ))}
                    </div>
                  </>
                ) : ('''
          if old not in text:
              raise SystemExit('Bible reader closing block not found')
          text = text.replace(old, new, 1)

          old = '''    <div className={cn("flex flex-col h-full min-h-0 bg-paper-50 dark:bg-navy-900 transition-all", isFocusMode && "bg-white dark:bg-black")}>'''
          new = '''    <div className={cn("app-reader-shell flex flex-col h-full min-h-0 bg-paper-50 dark:bg-navy-900 transition-all", isFocusMode && "bg-white dark:bg-black")}>'''
          if old in text:
              text = text.replace(old, new, 1)

          if text == original:
              raise SystemExit('No App.tsx changes made')
          path.write_text(text, encoding='utf-8')

      - name: Add modern visual system
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/index.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* Premium reading experience: restrained glass, stronger hierarchy, accessible motion. */'
          if marker not in text:
              text += r'''

/* Premium reading experience: restrained glass, stronger hierarchy, accessible motion. */
:root { --ui-shadow: 0 12px 34px rgba(15, 23, 42, 0.08); --ui-shadow-hover: 0 18px 42px rgba(15, 23, 42, 0.13); }
.app-reader-shell { isolation: isolate; }
.app-reader-surface { box-shadow: var(--ui-shadow); transition: box-shadow .25s ease, transform .25s ease; }
.app-reader-surface:hover { box-shadow: var(--ui-shadow-hover); }
.reader-text-scroll { scrollbar-width: thin; scrollbar-color: rgba(15,118,110,.55) transparent; scrollbar-gutter: stable; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.reader-text-scroll::-webkit-scrollbar { width: 8px; }
.reader-text-scroll::-webkit-scrollbar-track { background: transparent; }
.reader-text-scroll::-webkit-scrollbar-thumb { background: rgba(15,118,110,.52); border: 2px solid transparent; background-clip: padding-box; border-radius: 999px; }
.reader-tool-button,.reader-primary-action,.reader-secondary-action { min-height: 38px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 800; transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease; -webkit-tap-highlight-color: transparent; }
.reader-tool-button { width: 38px; background: rgba(255,255,255,.68); color: #334155; border: 1px solid rgba(148,163,184,.18); }
.reader-primary-action { padding: 0 12px; color: white; background: #0f766e; box-shadow: 0 6px 18px rgba(15,118,110,.25); }
.reader-secondary-action { padding: 0 12px; color: #0f766e; background: rgba(255,255,255,.72); border: 1px solid rgba(15,118,110,.18); }
.reader-tool-button:hover,.reader-primary-action:hover,.reader-secondary-action:hover { transform: translateY(-1px); }
.reader-tool-button:active,.reader-primary-action:active,.reader-secondary-action:active { transform: scale(.98); }
.reader-tool-button:focus-visible,.reader-primary-action:focus-visible,.reader-secondary-action:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible { outline: 3px solid rgba(15,118,110,.35); outline-offset: 2px; }
@media (max-width: 640px) { .reader-text-scroll { max-height: 68vh !important; padding-right: 8px; } .reader-tool-button,.reader-primary-action,.reader-secondary-action { min-height: 42px; } .reader-primary-action span,.reader-secondary-action span { display: none; } }
@media (prefers-reduced-motion: reduce) { .app-reader-surface,.reader-tool-button,.reader-primary-action,.reader-secondary-action { transition: none !important; } }
'''
              path.write_text(text, encoding='utf-8')

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit polished reader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add src/App.tsx src/index.css
          git commit -m "Polish Bible reader UX"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/polish-bible-reader.yml
          git commit -m "Remove one-time Bible reader automation"
          git push
