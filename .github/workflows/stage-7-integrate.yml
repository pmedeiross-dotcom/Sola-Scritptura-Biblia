name: Stage 7 integration
on:
  push:
    branches: [stage-7-integration]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate activity tracking
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          if "from './activityTracking'" not in s:
              anchor = "import type { DictionaryEntry } from '../types';\n"
              s = s.replace(anchor, anchor + "import { appendActivityEvent, readActivityEvents } from './activityTracking';\n")
          s = s.replace("const ENABLE_ACTIVITY_TRACKING = false;", "const ENABLE_ACTIVITY_TRACKING = true;")
          old = """  const trackActivity = (type: string, label: string) => {\n    if (!ENABLE_ACTIVITY_TRACKING) return;\n    if (isUselessActivityEvent({ type, label })) return;\n    setActivityEvents(prev => {\n      const next = [{ id: `${Date.now()}-${Math.random()}`, type, label, timestamp: Date.now() }, ...prev].slice(0, 200);\n      localStorage.setItem('activity-events-v1', JSON.stringify(next));\n      return next;\n    });\n  };"""
          new = """  const trackActivity = (type: string, label: string) => {\n    if (!ENABLE_ACTIVITY_TRACKING) return;\n    setActivityEvents(prev => appendActivityEvent(prev, type, label));\n  };"""
          if old in s:
              s = s.replace(old, new)
          elif "appendActivityEvent(prev, type, label)" not in s:
              raise SystemExit('trackActivity block not found')
          old_effect = """  useEffect(() => {\n    localStorage.removeItem('activity-events-v1');\n    setActivityEvents([]);"""
          new_effect = """  useEffect(() => {\n    setActivityEvents(readActivityEvents());"""
          if old_effect in s:
              s = s.replace(old_effect, new_effect, 1)
          elif "setActivityEvents(readActivityEvents())" not in s:
              raise SystemExit('activity cleanup effect not found')
          p.write_text(s, encoding='utf-8')
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
          npm run check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet || git commit -m "feat: integrate persistent activity tracking"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/stage-7-integrate.yml
          git commit -m "chore: remove temporary stage 7 workflow"
          git push
