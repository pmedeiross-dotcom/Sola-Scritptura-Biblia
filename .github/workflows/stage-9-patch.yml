name: Stage 9 patch
on:
  push:
    branches: [stage-9-confessions-ai]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch confession study flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = '''    const handleStudyConfession = async () => {
      setLoadingStudy(true);
      try {
        setStudyResponse("Funcionalidade de IA removida do projeto.");
      } catch (err) {
        console.error(err);
      } finally {
        setLoadingStudy(false);
      }
    };'''
          new = '''    const handleStudyConfession = async () => {
      if (!selected) return;
      setLoadingStudy(true);
      setStudyResponse(null);
      try {
        const section = hasStructuredIndex && selectedChapterIndex !== null
          ? confessionSections[selectedChapterIndex]
          : null;
        const focus = section?.title || selected.title;
        const query = focus.replace(/[^\\w\\s-]/g, ' ').replace(/\\s+/g, ' ').trim();
        const report = await runInternalBibleAI({
          termsInput: query,
          scope: 'bible',
          version: 'ARC',
          options: {
            enableSemanticExpansion: true,
            enableStemming: true,
            enableStrongLexical: true,
            enableAppKnowledge: true,
          },
        });
        const formatted = formatInternalBibleAIReportMarkdown(report);
        setStudyResponse([
          `### Estudo interno relacionado a ${focus}`,
          '',
          'Esta análise é gerada localmente a partir do texto bíblico, dos recursos confessionais e das notas disponíveis no aplicativo. Ela não é uma resposta de modelo generativo externo.',
          '',
          formatted,
        ].join('\\n'));
      } catch (err) {
        console.error(err);
        setStudyResponse('## Estudo interno\\n\\nNão foi possível concluir a análise com os dados disponíveis. Tente novamente ou amplie o conteúdo da consulta.');
      } finally {
        setLoadingStudy(false);
      }
    };'''
          if old not in s:
              raise SystemExit('target handler not found')
          s = s.replace(old, new, 1)
          s = s.replace('{loadingStudy ? "Analisando..." : "Estudar com IA"}', '{loadingStudy ? "Analisando..." : "Estudar com recursos internos"}', 1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx
          git commit -m "feat: complete confession internal study flow" || exit 0
          git push
