name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Stage 5 patch
        if: github.ref == 'refs/heads/etapa-5-reference-parser'
        run: |
          python3 scripts/stage5_patch.py
          if git diff --quiet -- src/App.tsx PROJECT_STATUS.md; then
            exit 0
          fi
          rm -f .github/workflows/etapa5-apply.yml scripts/stage5_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx PROJECT_STATUS.md .github/workflows/etapa5-apply.yml scripts/stage5_patch.py
          git commit -m 'fix: integrate robust Bible reference navigation'
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build
