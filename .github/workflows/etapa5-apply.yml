name: Apply Stage 5
on:
  push:
    branches: [etapa-5-reference-parser]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/App.tsx')
          s=p.read_text(encoding='utf-8')
          old=r'''  const selectReference = (ref: string) => {
  // Basic parser for "Book Chapter:Verse" or "Book Chapter"
  const parts = ref.trim().split(' ');
  const chapterPart = parts.pop();
  const bookName = parts.join(' ');

  const foundBook = BOOKS.find(
    b => b.name.toLowerCase() === bookName.toLowerCase()
  );

  if (foundBook) {
    setBook(foundBook);

    const [chapterText, verseText] = (chapterPart || '1').split(':');
    const c = parseInt(chapterText || '1', 10);
    const v = verseText ? parseInt(verseText, 10) : null;

    setChapter(c);

    if (v !== null && !Number.isNaN(v)) {
      setTargetVerse(String(v));
      setPendingVerseJump(v);
    }

    setShowSearch(false);
    setSearchQuery('');
    setSearchResults([]);
    setSearchError(null);
    setHasSearched(false);
  }
};'''
          new=r'''  const selectReference = (ref: string) => {
    const normalizedRef = ref.trim().replace(/\s+/g, ' ');
    if (!normalizedRef) return;

    const match = normalizedRef.match(/\s(\d+)(?::(\d+))?$/);
    if (!match || match.index === undefined) return;

    const bookName = normalizedRef.slice(0, match.index).trim();
    const foundBook = BOOKS.find(
      candidate => candidate.name.toLowerCase() === bookName.toLowerCase()
    );
    if (!foundBook) return;

    const selectedChapter = Number(match[1]);
    const selectedVerse = match[2] ? Number(match[2]) : null;
    if (selectedChapter < 1 || selectedChapter > foundBook.chapters) return;
    if (selectedVerse !== null && selectedVerse < 1) return;

    setBook(foundBook);
    setChapter(selectedChapter);
    setTargetVerse(selectedVerse === null ? '' : String(selectedVerse));
    setPendingVerseJump(selectedVerse);
    setShowSearch(false);
    setSearchQuery('');
    setSearchResults([]);
    setSearchError(null);
    setHasSearched(false);
  };'''
          if old not in s: raise SystemExit('selectReference block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          q=Path('PROJECT_STATUS.md')
          t=q.read_text(encoding='utf-8')
          t=t.replace('5. Fluxo de referências do Reader: **EM ANDAMENTO**','5. Fluxo de referências do Reader: **CONCLUÍDA**')
          t=t.replace('## Etapa 5 em andamento: Fluxo de referências do Reader','## Etapa 5 concluída: Fluxo de referências do Reader')
          t=t.replace('A integração final desse parser em `src/App.tsx` e a validação por lint/build ainda precisam ser concluídas antes de marcar a etapa como concluída.','O parser foi integrado ao `BibleScreen`; a validação deve ser confirmada pelo CI antes do merge.')
          t=t.replace('## Registro de alterações','## Registro de alterações\n\n### 2026-09-15\n\n- Integrado o parser robusto ao fluxo `busca → referência → Reader → versículo`.\n- Referências com livros numerados, como `1 João` e `1 Coríntios`, são reconhecidas.\n')
          q.write_text(t,encoding='utf-8')
          PY
          rm .github/workflows/etapa5-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx PROJECT_STATUS.md .github/workflows/etapa5-apply.yml
          git commit -m 'fix: integrate robust Bible reference navigation'
          git push