name: Apply Stage 5
on:
  push:
    branches: [etapa-5-reference-parser]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text(encoding='utf-8')
          start=s.index("  const selectReference = (ref: string) => {")
          end=s.index("\n  };", start)+len("\n  };")
          new='''  const selectReference = (ref: string) => {
    const normalizedRef = ref.trim().replace(/\\s+/g, ' ');
    if (!normalizedRef) return;

    const match = normalizedRef.match(/\\s(\\d+)(?::(\\d+))?$/);
    if (!match || match.index === undefined) return;

    const bookName = normalizedRef.slice(0, match.index).trim();
    const foundBook = BOOKS.find(
      candidate => candidate.name.toLowerCase() === bookName.toLowerCase()
    );
    if (!foundBook) return;

    const selectedChapter = Number(match[1]);
    const selectedVerse = match[2] ? Number(match[2]) : null;
    if (selectedChapter < 1 || selectedChapter > foundBook.chapters) return;
    if (selectedVerse !== null && selectedVerse < 1) return;

    setBook(foundBook);
    setChapter(selectedChapter);
    setTargetVerse(selectedVerse === null ? '' : String(selectedVerse));
    setPendingVerseJump(selectedVerse);
    setShowSearch(false);
    setSearchQuery('');
    setSearchResults([]);
    setSearchError(null);
    setHasSearched(false);
  };'''
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')

          q=Path('PROJECT_STATUS.md')
          t=q.read_text(encoding='utf-8')
          t=t.replace('5. Fluxo de referências do Reader: **EM ANDAMENTO**','5. Fluxo de referências do Reader: **CONCLUÍDA**')
          t=t.replace('## Etapa 5 em andamento: Fluxo de referências do Reader','## Etapa 5 concluída: Fluxo de referências do Reader')
          t=t.replace('A integração final desse parser em `src/App.tsx` e a validação por lint/build ainda precisam ser concluídas antes de marcar a etapa como concluída.','O parser foi integrado ao `BibleScreen`; lint e build devem ser confirmados pelo CI antes do merge.')
          marker='## Registro de alterações'
          if marker in t and 'fix: integrar parser robusto' not in t:
            t=t.replace(marker, marker+'\n\n### 2026-09-15\n\n- fix: integrar parser robusto ao fluxo `busca → referência → Reader → versículo`.\n- Referências com livros numerados, como `1 João` e `1 Coríntios`, são reconhecidas.\n',1)
          q.write_text(t,encoding='utf-8')
          PY
          rm .github/workflows/etapa5-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx PROJECT_STATUS.md .github/workflows/etapa5-apply.yml
          git commit -m 'fix: integrate robust Bible reference navigation'
          git push
# retry trigger
