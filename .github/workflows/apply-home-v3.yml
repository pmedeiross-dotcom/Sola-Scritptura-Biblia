name: Apply final Home redesign

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign:
    if: github.event.head_commit.message != 'Redesign HomeScreen v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace the active HomeScreen
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          start = text.find('const HomeScreen = ({')
          end = text.find('\nconst BibleScreen = (', start)
          if start < 0 or end < 0:
              raise SystemExit('Active HomeScreen boundaries not found')

          replacement = r'''const HomeScreen = ({
  onNavigate,
  onOpenPlan,
}: {
  onNavigate: (s: Screen) => void;
  onOpenPlan: (plan: ReadingPlan) => void;
}) => {
  const [verse, setVerse] = useState({
    text: 'Lâmpada para os meus pés é tua palavra, e luz para o meu caminho.',
    ref: 'Salmos 119:105',
  });
  const [lastReadingLocation, setLastReadingLocation] = useState<string | null>(null);

  useEffect(() => {
    let active = true;

    const load = async () => {
      try {
        const dailyRef = DAILY_VERSE_REFERENCES[getDailyReferenceIndex(new Date())];
        const preferredVersion = localStorage.getItem('preferred-bible-version') || 'ARC';
        const chapter = await getLocalBibleChapterLazy(dailyRef.book, dailyRef.chapter, preferredVersion);
        const item = chapter.find(v => v.verse === dailyRef.verse);
        if (active && item?.text) {
          setVerse({
            text: item.text.trim(),
            ref: `${dailyRef.book} ${dailyRef.chapter}:${dailyRef.verse}`,
          });
        }
      } catch {
        // Keep the safe fallback verse when the local Bible is unavailable.
      }

      try {
        const locations = JSON.parse(localStorage.getItem('reading-locations') || '[]') as Array<{ label?: string }>;
        if (active && locations[0]?.label) setLastReadingLocation(locations[0].label);
      } catch {
        if (active) setLastReadingLocation(null);
      }
    };

    void load();
    return () => { active = false; };
  }, []);

  const quickActions: Array<{
    id: string;
    label: string;
    description: string;
    icon: React.ComponentType<{ className?: string }>;
    screen: Screen;
    tone: string;
  }> = [
    { id: 'bible', label: 'Ler Bíblia', description: 'Leia e navegue pelas Escrituras', icon: Book, screen: 'bible', tone: 'ss-action-gold' },
    { id: 'study', label: 'Estudar', description: 'Análise bíblica e teológica', icon: Sparkles, screen: 'study', tone: 'ss-action-green' },
    { id: 'search', label: 'Pesquisar', description: 'Encontre uma passagem', icon: Search, screen: 'bible', tone: 'ss-action-blue' },
    { id: 'notes', label: 'Anotações', description: 'Registre suas reflexões', icon: MessageSquare, screen: 'library', tone: 'ss-action-violet' },
  ];

  const secondaryActions: Array<{
    label: string;
    icon: React.ComponentType<{ className?: string }>;
    screen: Screen;
  }> = [
    { label: 'Favoritos', icon: Bookmark, screen: 'library' },
    { label: 'Marcações', icon: Highlighter, screen: 'library' },
    { label: 'Histórico', icon: History, screen: 'library' },
    { label: 'Traduções', icon: Layers, screen: 'bible' },
    { label: 'Plano de leitura', icon: Calendar, screen: 'reading-plans' },
    { label: 'Confissões', icon: Library, screen: 'confessions' },
    { label: 'Biblioteca', icon: Book, screen: 'library' },
    { label: 'Configurações', icon: SettingsIcon, screen: 'settings' },
  ];

  const continueReading = () => {
    onNavigate('bible');
  };

  const shareVerse = async () => {
    if (navigator.share) {
      try {
        await navigator.share({ title: 'Sola Scriptura', text: `“${verse.text}” — ${verse.ref}` });
      } catch {
        // User cancelled the native share sheet.
      }
    }
  };

  return (
    <div className="ss-home animate-fade-in">
      <div className="ss-home-inner">
        <header className="ss-home-header">
          <div>
            <span className="ss-eyebrow">SOLA SCRIPTURA</span>
            <h1>Leia. Examine. Compreenda.</h1>
            <p>Seu espaço para leitura bíblica e estudo da fé reformada.</p>
          </div>
          <button
            onClick={() => onNavigate('settings')}
            className="ss-icon-button"
            aria-label="Abrir configurações"
          >
            <SettingsIcon className="w-5 h-5" />
          </button>
        </header>

        <section className="ss-hero">
          <div className="ss-hero-copy">
            <span className="ss-hero-label">VERSÍCULO DO DIA</span>
            <p>“{verse.text}”</p>
            <strong>{verse.ref}</strong>
          </div>
          <div className="ss-hero-actions">
            <button onClick={shareVerse} className="ss-round-button" aria-label="Compartilhar versículo">
              <Share2 className="w-5 h-5" />
            </button>
            <button onClick={() => onNavigate('bible')} className="ss-read-button">
              Ler agora <ChevronRight className="w-4 h-4" />
            </button>
          </div>
        </section>

        <section className="ss-section">
          <div className="ss-section-title">
            <div>
              <span className="ss-eyebrow">ACESSO RÁPIDO</span>
              <h2>O que você quer fazer?</h2>
            </div>
          </div>

          <div className="ss-primary-grid">
            {quickActions.map(({ id, label, description, icon: Icon, screen, tone }) => (
              <button key={id} onClick={() => onNavigate(screen)} className={`ss-primary-card ${tone}`}>
                <span className="ss-card-icon"><Icon className="w-6 h-6" strokeWidth={1.9} /></span>
                <span className="ss-card-copy">
                  <strong>{label}</strong>
                  <small>{description}</small>
                </span>
                <ChevronRight className="ss-card-arrow w-5 h-5" />
              </button>
            ))}
          </div>
        </section>

        <section className="ss-section">
          <div className="ss-section-title">
            <div>
              <span className="ss-eyebrow">RECURSOS</span>
              <h2>Tudo em um só lugar</h2>
            </div>
            <span className="ss-count">8 atalhos</span>
          </div>
          <div className="ss-resource-grid">
            {secondaryActions.map(({ label, icon: Icon, screen }) => (
              <button key={label} onClick={() => onNavigate(screen)} className="ss-resource-card">
                <span className="ss-resource-icon"><Icon className="w-5 h-5" strokeWidth={1.8} /></span>
                <strong>{label}</strong>
              </button>
            ))}
          </div>
        </section>

        <section className="ss-section">
          <div className="ss-section-title">
            <div>
              <span className="ss-eyebrow">CONTINUE SEU CAMINHO</span>
              <h2>Planos de leitura</h2>
            </div>
            <button onClick={() => onNavigate('reading-plans')} className="ss-see-all">Ver todos</button>
          </div>

          <div className="ss-plans-grid">
            {READING_PLANS.map(plan => {
              const target = getPlanReferenceTarget(plan);
              return (
                <article key={plan.id} className="ss-plan-card">
                  <div className="ss-plan-top">
                    <span className="ss-plan-icon"><Calendar className="w-5 h-5" /></span>
                    <span>Dia {plan.currentDay}/{plan.days}</span>
                  </div>
                  <h3>{plan.title}</h3>
                  <p>Hoje: {target.label}</p>
                  <div className="ss-progress"><span style={{ width: `${plan.progress}%` }} /></div>
                  <div className="ss-plan-bottom">
                    <span>{plan.progress}% concluído</span>
                    <button onClick={() => onOpenPlan(plan)}>Continuar</button>
                  </div>
                </article>
              );
            })}
          </div>
        </section>

        <section className="ss-resume-banner">
          <div className="ss-resume-icon"><Book className="w-6 h-6" /></div>
          <div>
            <span className="ss-eyebrow">SUA LEITURA</span>
            <h2>{lastReadingLocation ? `Continue em ${lastReadingLocation}` : 'Comece sua leitura hoje'}</h2>
            <p>{lastReadingLocation ? 'Retome exatamente do ponto que você salvou.' : 'Abra a Bíblia e salve seu primeiro local de leitura.'}</p>
          </div>
          <button onClick={continueReading} className="ss-resume-cta">Abrir Bíblia <ChevronRight className="w-4 h-4" /></button>
        </section>
      </div>
    </div>
  );
};
'''

          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

      - name: Add final Home styling
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/index.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* SOLA SCRIPTURA HOME V3 */'
          if marker not in text:
              text += r'''

/* SOLA SCRIPTURA HOME V3 */
.ss-home{height:100%;min-height:0;overflow-y:auto;background:#f4f6fb;color:#17212b}
.dark .ss-home{background:#0b1117;color:#eef2f5}
.ss-home-inner{width:100%;max-width:1220px;margin:0 auto;padding:28px 28px 52px}
.ss-home-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}
.ss-eyebrow{display:block;font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:#0f766e}
.ss-home-header h1{margin:7px 0 5px;font:900 clamp(1.8rem,3.5vw,2.65rem)/1.05 Georgia,serif;letter-spacing:-.04em;color:#111827}
.dark .ss-home-header h1{color:#f8fafc}
.ss-home-header p{margin:0;color:#718096;font-size:.9rem}
.ss-icon-button{width:44px;height:44px;display:grid;place-items:center;border:1px solid #e2e8f0;border-radius:14px;background:#fff;color:#64748b;box-shadow:0 8px 24px rgba(15,23,42,.06);transition:.2s}
.ss-icon-button:hover{transform:translateY(-2px);color:#4f46e5}
.dark .ss-icon-button{background:#17212b;border-color:#2a3642;color:#cbd5e1}
.ss-hero{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;min-height:235px;padding:30px 32px;overflow:hidden;border-radius:30px;color:#fff;background:linear-gradient(135deg,#4f46e5 0%,#3730a3 100%);box-shadow:0 24px 55px rgba(67,56,202,.23)}
.ss-hero:before{content:'';position:absolute;width:330px;height:330px;right:-100px;top:-180px;border-radius:50%;background:rgba(255,255,255,.12)}
.ss-hero:after{content:'';position:absolute;width:180px;height:180px;left:35%;bottom:-145px;border-radius:50%;background:rgba(255,255,255,.06)}
.ss-hero-copy{position:relative;z-index:1;max-width:900px}
.ss-hero-label{font-size:10px;font-weight:900;letter-spacing:.2em;color:rgba(255,255,255,.68)}
.ss-hero-copy p{margin:19px 0 16px;font:italic 500 clamp(1.45rem,3vw,2.25rem)/1.3 Georgia,serif}
.ss-hero-copy strong{font-size:1rem}
.ss-hero-actions{position:relative;z-index:1;display:flex;align-items:center;gap:9px}
.ss-round-button{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px)}
.ss-read-button{height:46px;display:flex;align-items:center;gap:5px;padding:0 15px;border-radius:14px;background:#fff;color:#3730a3;font-size:.76rem;font-weight:900;box-shadow:0 10px 25px rgba(0,0,0,.12)}
.ss-section{margin-top:30px}
.ss-section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:13px;padding:0 2px}
.ss-section-title h2{margin:4px 0 0;font-size:1.18rem;font-weight:900;letter-spacing:-.02em;color:#111827}
.dark .ss-section-title h2{color:#f8fafc}
.ss-count,.ss-see-all{font-size:.68rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#4f46e5}
.ss-primary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.ss-primary-card{min-height:145px;position:relative;padding:18px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:12px;text-align:left;border:1px solid #e5eaf0;border-radius:23px;background:#fff;box-shadow:0 9px 28px rgba(15,23,42,.055);transition:transform .2s,box-shadow .2s}
.ss-primary-card:hover{transform:translateY(-3px);box-shadow:0 16px 35px rgba(15,23,42,.1)}
.dark .ss-primary-card{background:#17212b;border-color:#273441}
.ss-card-icon{width:46px;height:46px;display:grid;place-items:center;border-radius:14px}
.ss-card-copy strong,.ss-card-copy small{display:block}.ss-card-copy strong{font-size:.98rem;font-weight:900;color:#111827}.dark .ss-card-copy strong{color:#f8fafc}.ss-card-copy small{margin-top:4px;color:#718096;font-size:.7rem;line-height:1.35}.ss-card-arrow{position:absolute;right:17px;bottom:18px;color:#a0aec0}
.ss-action-gold .ss-card-icon{background:#fef3c7;color:#b45309}.ss-action-green .ss-card-icon{background:#d1fae5;color:#059669}.ss-action-blue .ss-card-icon{background:#dbeafe;color:#2563eb}.ss-action-violet .ss-card-icon{background:#ede9fe;color:#7c3aed}
.ss-resource-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px}
.ss-resource-card{min-height:91px;padding:10px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1px solid #e5eaf0;border-radius:18px;background:rgba(255,255,255,.84);color:#64748b;transition:.18s}
.ss-resource-card:hover{transform:translateY(-2px);color:#4f46e5;border-color:#d9dcff}.dark .ss-resource-card{background:#151e27;border-color:#273441;color:#cbd5e1}.ss-resource-card strong{font-size:.67rem;text-align:center;line-height:1.15}.ss-resource-icon{color:#5b5ce2}
.ss-plans-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.ss-plan-card{padding:19px;border:1px solid #e5eaf0;border-radius:23px;background:#fff;box-shadow:0 9px 28px rgba(15,23,42,.045)}.dark .ss-plan-card{background:#17212b;border-color:#273441}.ss-plan-top{display:flex;align-items:center;justify-content:space-between;color:#8a97a5;font-size:.68rem;font-weight:800}.ss-plan-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#eef2ff;color:#4f46e5}.ss-plan-card h3{margin:14px 0 5px;font-size:.98rem;font-weight:900;color:#111827}.dark .ss-plan-card h3{color:#f8fafc}.ss-plan-card p{margin:0 0 13px;color:#4f46e5;font-size:.7rem;font-weight:700}.ss-progress{height:7px;overflow:hidden;border-radius:99px;background:#edf0f4}.ss-progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#4f46e5,#6366f1)}.ss-plan-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.ss-plan-bottom span{font-size:.65rem;font-weight:800;text-transform:uppercase;color:#94a3b8}.ss-plan-bottom button{font-size:.72rem;font-weight:900;color:#4f46e5}
.ss-resume-banner{margin-top:28px;display:flex;align-items:center;gap:15px;padding:18px 20px;border-radius:23px;border:1px solid #dce4ea;background:linear-gradient(135deg,#fff,#f8fafc);box-shadow:0 10px 28px rgba(15,23,42,.05)}.dark .ss-resume-banner{background:#17212b;border-color:#273441}.ss-resume-icon{width:48px;height:48px;display:grid;place-items:center;flex:none;border-radius:15px;background:#e0f2fe;color:#0369a1}.ss-resume-banner h2{margin:3px 0;font-size:.95rem;font-weight:900}.ss-resume-banner p{margin:0;color:#718096;font-size:.7rem}.ss-resume-cta{margin-left:auto;display:flex;align-items:center;gap:5px;white-space:nowrap;padding:11px 14px;border-radius:13px;background:#0f766e;color:#fff;font-size:.72rem;font-weight:900}
@media(max-width:1050px){.ss-primary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ss-resource-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.ss-plans-grid{grid-template-columns:1fr}.ss-plan-card{min-width:0}}
@media(max-width:680px){.ss-home-inner{padding:18px 14px 36px}.ss-home-header{margin-bottom:14px}.ss-home-header h1{font-size:1.7rem}.ss-home-header p{font-size:.78rem}.ss-hero{display:block;min-height:0;padding:24px;border-radius:24px}.ss-hero-copy p{font-size:1.38rem;margin-top:16px}.ss-hero-actions{margin-top:20px}.ss-primary-grid{grid-template-columns:1fr 1fr;gap:9px}.ss-primary-card{min-height:145px;padding:15px}.ss-resource-grid{grid-template-columns:repeat(4,1fr);gap:7px}.ss-resource-card{min-height:75px;border-radius:15px}.ss-resource-card strong{font-size:.58rem}.ss-resource-icon{transform:scale(.85)}.ss-resume-banner{align-items:flex-start;flex-wrap:wrap}.ss-resume-cta{margin-left:63px}.ss-section{margin-top:24px}}
@media(max-width:430px){.ss-primary-grid{grid-template-columns:1fr}.ss-resource-grid{grid-template-columns:repeat(2,1fr)}.ss-home-header .ss-icon-button{width:40px;height:40px}.ss-read-button{padding:0 12px}}
'''
              path.write_text(text, encoding='utf-8')

      - name: Build and publish
        run: |
          npm ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-home-v3.yml
          git add src/App.tsx src/index.css .github/workflows/apply-home-v3.yml
          git commit -m "Redesign HomeScreen v3"
          git push
