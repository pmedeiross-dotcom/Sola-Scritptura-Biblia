name: Apply Home v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Redesign HomeScreen v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply redesign
        run: python3 scripts/apply_home_v3.py
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-home-v3.yml scripts/apply_home_v3.py
          git add src/App.tsx src/index.css src/components/HomeScreenV3.tsx .github/workflows/apply-home-v3.yml scripts/apply_home_v3.py
          git commit -m "Redesign HomeScreen v3"
          git push
