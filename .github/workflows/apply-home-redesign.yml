name: Apply active HomeScreen redesign

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign:
    if: github.event.head_commit.message != 'Apply active HomeScreen redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace the active HomeScreen
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          start = text.index('const HomeScreen = ({')
          end = text.index('\nconst ReadingPlansScreen = ({', start)
          replacement = r'''const HomeScreen = ({
  onNavigate,
  onOpenPlan,
}: {
  onNavigate: (s: Screen) => void;
  onOpenPlan: (plan: ReadingPlan) => void;
}) => {
  const [verse, setVerse] = useState({ text: "Porque Deus amou o mundo de tal maneira que deu o seu Filho unigênito...", ref: "João 3:16" });
  const [lastReadingLocation, setLastReadingLocation] = useState<{ label: string; createdAt: number } | null>(null);

  useEffect(() => {
    let active = true;
    const load = async () => {
      try {
        const dailyRef = DAILY_VERSE_REFERENCES[getDailyReferenceIndex(new Date())];
        const preferredVersion = localStorage.getItem('preferred-bible-version') || 'ARC';
        const loadVersion = async (code: string) => {
          const chapterVerses = await getLocalBibleChapterLazy(dailyRef.book, dailyRef.chapter, code);
          return chapterVerses.find(item => item.verse === dailyRef.verse)?.text?.trim() || null;
        };
        const text = (await loadVersion(preferredVersion)) || (preferredVersion !== 'ARC' ? await loadVersion('ARC') : null);
        if (active && text) setVerse({ text, ref: `${dailyRef.book} ${dailyRef.chapter}:${dailyRef.verse}` });
      } catch { }
    };
    void load();
    try {
      const locations = JSON.parse(localStorage.getItem('reading-locations') || '[]') as Array<{ label: string; createdAt: number }>;
      setLastReadingLocation(locations[0] ?? null);
    } catch { setLastReadingLocation(null); }
    return () => { active = false; };
  }, []);

  const quickActions: Array<{ id: string; label: string; description: string; icon: React.ComponentType<{ className?: string }>; screen: Screen; tone: string }> = [
    { id: 'bible', label: 'Ler Bíblia', description: 'Leia e navegue pelas Escrituras', icon: Book, screen: 'bible', tone: 'home-action-gold' },
    { id: 'study', label: 'Estudar', description: 'Análise bíblica e teológica', icon: Sparkles, screen: 'study', tone: 'home-action-green' },
    { id: 'search', label: 'Pesquisar', description: 'Encontre uma passagem', icon: Search, screen: 'bible', tone: 'home-action-blue' },
    { id: 'notes', label: 'Anotações', description: 'Suas notas e reflexões', icon: Bookmark, screen: 'library', tone: 'home-action-violet' },
  ];

  const secondaryActions: Array<{ label: string; icon: React.ComponentType<{ className?: string }>; screen: Screen }> = [
    { label: 'Favoritos', icon: Bookmark, screen: 'library' },
    { label: 'Histórico', icon: History, screen: 'library' },
    { label: 'Traduções', icon: Layers, screen: 'bible' },
    { label: 'Plano de leitura', icon: Calendar, screen: 'reading-plans' },
    { label: 'Temas', icon: Search, screen: 'study' },
    { label: 'Confissões', icon: Library, screen: 'confessions' },
    { label: 'Biblioteca', icon: Library, screen: 'library' },
    { label: 'Ajustes', icon: SettingsIcon, screen: 'settings' },
  ];

  const handleResume = () => {
    localStorage.setItem('pending-bible-resume', '1');
    onNavigate('bible');
  };

  const shareVerse = async () => {
    if (!navigator.share) return;
    try { await navigator.share({ title: 'Sola Scriptura', text: `"${verse.text}" — ${verse.ref}` }); } catch { }
  };

  return (
    <div className="home-launcher p-4 sm:p-6 lg:p-8 space-y-7 pb-24 lg:pb-10 animate-fade-in">
      <section className="home-welcome">
        <div>
          <span className="home-kicker">SOLA SCRIPTURA</span>
          <h1>Leia. Examine. Compreenda.</h1>
          <p>Seu espaço para leitura bíblica e estudo da fé reformada.</p>
        </div>
        <button onClick={handleResume} className="home-resume-button">
          <Book className="w-5 h-5" />
          <span>{lastReadingLocation ? `Continuar ${lastReadingLocation.label}` : 'Começar a ler'}</span>
          <ChevronRight className="w-5 h-5" />
        </button>
      </section>

      <section className="home-daily-verse">
        <div className="home-daily-copy">
          <span>VERSÍCULO DO DIA</span>
          <p>“{verse.text}”</p>
          <strong>{verse.ref}</strong>
        </div>
        <button onClick={shareVerse} className="home-share-button" aria-label="Compartilhar versículo"><Share2 className="w-5 h-5" /></button>
      </section>

      <section>
        <div className="home-section-heading"><div><span>ACESSO RÁPIDO</span><h2>O que você quer fazer?</h2></div></div>
        <div className="home-primary-grid">
          {quickActions.map(action => (
            <button key={action.id} onClick={() => onNavigate(action.screen)} className={`home-primary-action ${action.tone}`}>
              <div className="home-action-icon"><action.icon className="w-6 h-6" /></div>
              <div className="text-left"><strong>{action.label}</strong><span>{action.description}</span></div>
              <ChevronRight className="home-action-arrow w-5 h-5" />
            </button>
          ))}
        </div>
      </section>

      <section>
        <div className="home-secondary-grid">
          {secondaryActions.map(action => (
            <button key={action.label} onClick={() => onNavigate(action.screen)} className="home-secondary-action">
              <action.icon className="w-6 h-6" />
              <span>{action.label}</span>
            </button>
          ))}
        </div>
      </section>

      <section>
        <div className="home-section-heading"><div><span>CONTINUE SEU CAMINHO</span><h2>Planos de leitura</h2></div><button onClick={() => onNavigate('reading-plans')}>Ver todos</button></div>
        <div className="home-plans-grid">
          {READING_PLANS.map(plan => {
            const target = getPlanReferenceTarget(plan);
            return (
              <article key={plan.id} className="home-plan-card">
                <div className="home-plan-top"><div className="home-plan-icon"><Calendar className="w-5 h-5" /></div><span>Dia {plan.currentDay}/{plan.days}</span></div>
                <h3>{plan.title}</h3>
                <p>Hoje: {target.label}</p>
                <div className="home-progress"><span style={{ width: `${plan.progress}%` }} /></div>
                <div className="home-plan-bottom"><span>{plan.progress}% concluído</span><button onClick={() => onOpenPlan(plan)}>Continuar</button></div>
              </article>
            );
          })}
        </div>
      </section>
    </div>
  );
};
'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

      - name: Add launcher styling
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/index.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* Sola Scriptura launcher home */'
          if marker not in text:
            text += r'''

/* Sola Scriptura launcher home */
.home-launcher { max-width: 1180px; margin-inline: auto; }
.home-welcome { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:28px 30px; border:1px solid rgba(148,163,184,.18); border-radius:28px; background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(244,247,250,.94)); box-shadow:0 18px 45px rgba(15,23,42,.08); }
.dark .home-welcome { background:linear-gradient(135deg,rgba(24,31,43,.98),rgba(17,24,39,.96)); border-color:rgba(148,163,184,.14); }
.home-kicker,.home-daily-copy>span,.home-section-heading span { display:block; font-size:10px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; color:#0f766e; }
.home-welcome h1 { margin:7px 0 4px; font-size:clamp(1.65rem,3vw,2.5rem); line-height:1.05; font-weight:900; letter-spacing:-.04em; color:#0f172a; }
.dark .home-welcome h1 { color:#f8fafc; }
.home-welcome p { margin:0; color:#64748b; font-size:.95rem; }
.home-resume-button { flex-shrink:0; display:flex; align-items:center; gap:10px; min-height:48px; padding:0 18px; border-radius:16px; color:#fff; background:#0f766e; font-weight:800; box-shadow:0 10px 24px rgba(15,118,110,.25); transition:.2s ease; }
.home-resume-button:hover { transform:translateY(-2px); }
.home-daily-verse { position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; padding:30px 32px; min-height:190px; overflow:hidden; border-radius:30px; color:#fff; background:linear-gradient(135deg,#4f46e5,#3730a3); box-shadow:0 20px 45px rgba(67,56,202,.24); }
.home-daily-verse:after { content:''; position:absolute; width:260px; height:260px; right:-90px; top:-120px; border-radius:50%; background:rgba(255,255,255,.12); filter:blur(3px); }
.home-daily-copy { position:relative; z-index:1; max-width:900px; }
.home-daily-copy>span { color:rgba(255,255,255,.7); }
.home-daily-copy p { margin:16px 0 14px; font-family:Georgia,serif; font-style:italic; font-size:clamp(1.35rem,2.5vw,2.05rem); line-height:1.35; }
.home-daily-copy strong { font-size:1rem; }
.home-share-button { position:relative; z-index:1; width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.18); backdrop-filter:blur(10px); }
.home-section-heading { display:flex; align-items:end; justify-content:space-between; gap:12px; margin-bottom:14px; padding-inline:2px; }
.home-section-heading h2 { margin:4px 0 0; font-size:1.15rem; font-weight:900; color:#0f172a; }
.dark .home-section-heading h2 { color:#f8fafc; }
.home-section-heading>button { color:#4f46e5; font-size:.72rem; font-weight:900; text-transform:uppercase; letter-spacing:.08em; }
.home-primary-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
.home-primary-action { min-height:155px; padding:20px; display:flex; flex-direction:column; align-items:flex-start; justify-content:space-between; gap:16px; border:1px solid rgba(148,163,184,.18); border-radius:24px; background:#fff; box-shadow:0 10px 30px rgba(15,23,42,.06); text-align:left; transition:.2s ease; }
.dark .home-primary-action { background:#1f2937; border-color:rgba(148,163,184,.12); }
.home-primary-action:hover { transform:translateY(-3px); box-shadow:0 16px 36px rgba(15,23,42,.1); }
.home-action-icon { width:48px; height:48px; display:grid; place-items:center; border-radius:15px; }
.home-primary-action strong { display:block; font-size:1rem; font-weight:900; color:#111827; }
.dark .home-primary-action strong { color:#f8fafc; }
.home-primary-action span { display:block; margin-top:4px; font-size:.72rem; line-height:1.35; color:#64748b; }
.home-action-arrow { margin-left:auto; color:#94a3b8; }
.home-action-gold .home-action-icon { color:#b45309; background:#fef3c7; }
.home-action-green .home-action-icon { color:#059669; background:#d1fae5; }
.home-action-blue .home-action-icon { color:#2563eb; background:#dbeafe; }
.home-action-violet .home-action-icon { color:#7c3aed; background:#ede9fe; }
.home-secondary-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
.home-secondary-action { min-height:82px; padding:12px 10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border:1px solid rgba(148,163,184,.16); border-radius:18px; background:rgba(255,255,255,.82); color:#64748b; font-size:.72rem; font-weight:800; transition:.18s ease; }
.dark .home-secondary-action { background:rgba(31,41,55,.82); color:#cbd5e1; border-color:rgba(148,163,184,.1); }
.home-secondary-action:hover { color:#4f46e5; transform:translateY(-2px); }
.home-plans-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
.home-plan-card { padding:20px; border-radius:24px; background:#fff; border:1px solid rgba(148,163,184,.16); box-shadow:0 10px 30px rgba(15,23,42,.05); }
.dark .home-plan-card { background:#1f2937; border-color:rgba(148,163,184,.12); }
.home-plan-top { display:flex; align-items:center; justify-content:space-between; color:#94a3b8; font-size:.7rem; font-weight:800; }
.home-plan-icon { width:40px; height:40px; display:grid; place-items:center; border-radius:13px; color:#4f46e5; background:#eef2ff; }
.home-plan-card h3 { margin:15px 0 5px; font-size:1rem; font-weight:900; color:#111827; }
.dark .home-plan-card h3 { color:#f8fafc; }
.home-plan-card p { margin:0 0 14px; color:#4f46e5; font-size:.72rem; font-weight:700; }
.home-progress { height:7px; overflow:hidden; border-radius:999px; background:#eef2f7; }
.home-progress span { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,#4f46e5,#6366f1); }
.home-plan-bottom { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; }
.home-plan-bottom span { color:#94a3b8; font-size:.66rem; font-weight:900; text-transform:uppercase; letter-spacing:.06em; }
.home-plan-bottom button { color:#4f46e5; font-size:.75rem; font-weight:900; }
@media (max-width: 900px) { .home-primary-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .home-plans-grid { grid-template-columns:1fr; } }
@media (max-width: 640px) { .home-welcome { flex-direction:column; align-items:stretch; padding:22px; } .home-resume-button { justify-content:center; } .home-daily-verse { min-height:210px; padding:24px; } .home-primary-grid,.home-secondary-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .home-primary-action { min-height:140px; padding:16px; } .home-primary-action span { font-size:.68rem; } }
'''
            path.write_text(text, encoding='utf-8')

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add src/App.tsx src/index.css
          git commit -m "Apply active HomeScreen redesign"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/apply-home-redesign.yml
          git commit -m "Remove one-time HomeScreen automation"
          git push
