name: Stage 10 code split

on:
  push:
    branches: [main]

jobs:
  split:
    runs-on: ubuntu-latest
    if: github.actor == 'pmedeiross-dotcom'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe code split
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          old = "import { formatInternalBibleAIReportMarkdown, runInternalBibleAI } from './services/internalBibleAI';"
          new = "const loadInternalBibleAI = () => import('./services/internalBibleAI');"
          if old not in s:
              raise SystemExit('static internalBibleAI import not found')
          s = s.replace(old, new, 1)
          old_call = "const report = await runInternalBibleAI({"
          new_call = "const { runInternalBibleAI, formatInternalBibleAIReportMarkdown } = await loadInternalBibleAI();\n      const report = await runInternalBibleAI({"
          if old_call not in s:
              raise SystemExit('runInternalBibleAI call not found')
          s = s.replace(old_call, new_call, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
          npm run check
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/stage-10-split.yml
          git commit -m "perf: lazy load internal bible ai service"
          git rm .github/workflows/stage-10-split.yml
          git commit -m "chore: remove temporary stage 10 workflow"
          git push
